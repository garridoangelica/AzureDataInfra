name: Fabric - Full Deployment (Dev → Test → Prod)

on:
  # push:
  #   branches: [main]
  #   paths:
  #     - 'Fabric/Workspaces/DataEngineeringWSDevCICD/**'
  #     - 'Fabric/Fabric-CICD/**'
  workflow_dispatch:
    inputs:
      skip_prod:
        description: 'Skip PROD deployment (only deploy to TEST)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  id-token: write
  contents: read

jobs:
  # ── Stage 1: Deploy to DEV ─────────────────────────────────────────────────
  deploy-dev:
    name: Deploy to DEV
    runs-on: ubuntu-latest
    environment: fabriccicd

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r Fabric/Fabric-CICD/requirements.txt

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Preflight validation (DEV)
        run: |
          cd Fabric/Fabric-CICD
          python deploy.py \
            --config config.yml \
            --environment DEV \
            --cli-auth \
            --validate

      - name: Deploy all items to DEV
        run: |
          cd Fabric/Fabric-CICD
          python deploy.py \
            --config config.yml \
            --environment DEV \
            --cli-auth

  # ── Stage 2: Deploy to TEST ────────────────────────────────────────────────
  deploy-test:
    name: Deploy to TEST
    runs-on: ubuntu-latest
    needs: deploy-dev
    environment: fabriccicd

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r Fabric/Fabric-CICD/requirements.txt

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Preflight validation (TEST)
        run: |
          cd Fabric/Fabric-CICD
          python deploy.py \
            --config config.yml \
            --environment TEST \
            --cli-auth \
            --validate

      - name: Deploy all items to TEST
        run: |
          cd Fabric/Fabric-CICD
          python deploy.py \
            --config config.yml \
            --environment TEST \
            --cli-auth

  # ── Stage 3: Deploy to PROD ────────────────────────────────────────────────
  deploy-prod:
    name: Deploy to PROD
    runs-on: ubuntu-latest
    needs: deploy-test
    if: ${{ github.event.inputs.skip_prod != 'true' }}
    environment: fabriccicd

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r Fabric/Fabric-CICD/requirements.txt

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Preflight validation (PROD)
        run: |
          cd Fabric/Fabric-CICD
          python deploy.py \
            --config config.yml \
            --environment PROD \
            --cli-auth \
            --validate

      - name: Deploy all items to PROD
        run: |
          cd Fabric/Fabric-CICD
          python deploy.py \
            --config config.yml \
            --environment PROD \
            --cli-auth
